name: ClipForge Editor TypeScript

on:
  push:
    branches:
      - main
      - feature/editor-phase-1-layout
  pull_request:
    branches:
      - main

jobs:
  editor-typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Type-check editor modules
        run: npm run typecheck
      - name: Build editor modules
        run: npm run build
