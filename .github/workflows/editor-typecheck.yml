name: ClipForge Editor TypeScript

on:
  push:
    branches:
      - main
      - feature/editor-phase-1-layout
      - refactor/public-multipage-20261105
  pull_request:
    branches:
      - main

jobs:
  editor-typecheck:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Type-check editor modules
        run: npm run typecheck
      - name: Build static Cloudflare Pages output
        run: npm run build
      - name: Verify tool routes and unchanged engines
        run: npm run test
      - name: Check generated JavaScript syntax
        run: |
          node --check public/assets/js/core/app.js
          node --check public/assets/js/core/navigation.js
          node --check navigation.js
          node --check editor-loader.js
          node --check animator-idle.js
          node --check public/assets/js/core/editor-loader.js
          node --check public/assets/js/core/animator-idle.js
          node --check public/assets/js/tools/captions-studio.js
          node --check public/assets/js/tools/captions-studio-enhancements.js
          node --check public/assets/js/tools/highlights-studio.js
          node --check public/assets/js/shared/transcription-queue.js
          node --check transcription-queue.js
          node --check public/dist/editor/studio-ui.js
          node --check public/_worker.js

      - name: Install headless Chromium for browser regression
        run: npx playwright install chromium
      - name: Test no-reload navigation in a real browser
        run: npm run test:browser

      - name: Upload compact All Tools mobile and desktop screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clipforge-compact-tools-review
          path: reports/compact-tools-*.png
          if-no-files-found: ignore

      - name: Upload Highlights Studio UI review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clipforge-highlights-layout-review
          path: reports/highlights-workspace-*.png
          if-no-files-found: ignore

      - name: Test Phase 1 lazy previews and inactive view cleanup
        run: npm run test:phase1
      - name: Record local browser performance measurements
        run: npm run bench:phase1
      - name: Upload performance benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: clipforge-phase1-performance
          path: reports/phase1-performance.json

      - name: Test Shorts transcript recovery UI in Chromium
        run: node scripts/test-shorts-browser.mjs
      - name: Benchmark two-request Highlights transcription queue
        run: npm run bench:phase2

      - name: Test mobile CapCut-like Studio editor
        run: npm run test:mobile-editor
      - name: Upload mobile Studio design screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clipforge-mobile-editor-preview
          path: reports/mobile-studio-*.png
          if-no-files-found: ignore
      - name: Install FFmpeg for real-media regression
        run: |
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version
          ffprobe -version
      - name: Test Studio browser fit after real MP4 import and desktop resizing
        run: node scripts/test-studio-viewport-browser.mjs
      - name: Upload Studio browser fit screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clipforge-studio-viewport-after-import
          path: reports/studio-viewport-after-import-desktop.png
          if-no-files-found: ignore
      - name: Verify professional inline Shorts preview on Android-size Chromium with real local video
        run: npm run test:shorts-inline
      - name: Upload Shorts mobile preview snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clipforge-shorts-inline-preview
          path: reports/shorts-inline-mobile.png
          if-no-files-found: ignore
      - name: Verify MP4 phone Gallery duration metadata with real fragmented H.264/AAC input
        run: npm run test:gallery-mp4
      - name: Test mobile editor with real video import, playback, split and undo
        run: node scripts/test-mobile-editor-media.mjs
      - name: Upload imported-video mobile Studio screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clipforge-mobile-editor-real-media
          path: reports/mobile-studio-imported-video.png
          if-no-files-found: ignore
      - name: Test Highlights with real WebM/Opus and mocked AI
        run: npm run test:media

      - name: Test trending captions and scrollable style gallery
        run: npm run test:caption-gallery
      - name: Upload caption gallery preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clipforge-caption-gallery-preview
          path: reports/trending-caption-gallery.png
          if-no-files-found: ignore
