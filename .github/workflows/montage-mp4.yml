name: Video Montage genuine MP4 export
on:
  pull_request:
    branches: [main]
    paths:
      - 'app.js'
      - 'montage-mp4.js'
      - 'scripts/build-pages.mjs'
      - 'scripts/test-montage-mp4-browser.mjs'
      - '.github/workflows/montage-mp4.yml'
  workflow_dispatch:

jobs:
  montage-mp4:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Check MP4 conversion script syntax
        run: node --check app.js && node --check montage-mp4.js && node --check scripts/test-montage-mp4-browser.mjs
      - name: Build Cloudflare Pages assets
        run: node scripts/build-pages.mjs
      - run: npx playwright install chromium
      - name: Verify 720p and 1080p H.264/AAC MP4 using real browser-generated video and audio
        run: node scripts/test-montage-mp4-browser.mjs
