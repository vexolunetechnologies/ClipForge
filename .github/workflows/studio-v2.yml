name: Studio V2 isolated browser checks
on:
  pull_request:
    branches: [main]
    paths:
      - 'public/studio-v2/**'
      - 'scripts/test-studio-v2-browser.mjs'
      - 'scripts/test-studio-v2-captions.mjs'
      - 'scripts/test-studio-v2-mov-export.mjs'
      - '.github/workflows/studio-v2.yml'
  workflow_dispatch:

jobs:
  studio-v2-browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node --check public/studio-v2/app.js && node --check public/studio-v2/auto-captions.js && node --check public/studio-v2/mov-import.js && node --check public/studio-v2/export-format.js
      - name: Build static shared caption library for Studio V2
        run: node scripts/build-pages.mjs
      - run: npx playwright install chromium
      - run: ffmpeg -version || (sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg)
      - name: Test V2 mobile and desktop with a real video
        run: node scripts/test-studio-v2-browser.mjs
      - name: Test V2 caption library and mocked Urdu transcription in a real browser
        run: node scripts/test-studio-v2-captions.mjs
      - name: Test MOV import and MP4 preferred export with real QuickTime media
        run: node scripts/test-studio-v2-mov-export.mjs
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-v2-layout-previews
          path: reports/studio-v2-*.png
          if-no-files-found: ignore
      - name: Package isolated V2 preview
        if: always()
        run: cd public && zip -q -r ../studio-v2-preview.zip studio-v2
      - name: Upload runnable V2 preview ZIP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clipforge-studio-v2-preview
          path: studio-v2-preview.zip
          if-no-files-found: ignore
